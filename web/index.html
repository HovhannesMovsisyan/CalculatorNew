<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A simple, fast calculator with keyboard support and light/dark themes." />
    <meta name="theme-color" content="#f0fdf4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <title>Calculator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2315803D'/%3E%3Cpath d='M19 26h26M19 38h26' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
        // Apply the saved theme before first paint to avoid a flash
        try {
            const theme = localStorage.getItem("calculator-theme");
            if (theme === "light" || theme === "dark")
                document.documentElement.dataset.theme = theme;
        } catch { }
    </script>
    <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <header class="calculator-header">
            <h1 class="title">Calculator</h1>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
                <!-- Moon: shown in light theme -->
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <!-- Sun: shown in dark theme -->
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </header>

        <!-- Display -->
        <div class="display" role="status" aria-live="polite" aria-label="Display">
            <div id="expression" class="expression"></div>
            <div class="result"><span id="result" class="result-value">0</span></div>
        </div>

        <div class="keys">
            <!-- Row 1 -->
            <button type="button" class="key function clear" data-action="clear" aria-label="Clear">C</button>
            <button type="button" class="key function" data-action="negate" aria-label="Change sign">±</button>
            <button type="button" class="key function" data-action="percent" aria-label="Percent">%</button>
            <button type="button" class="key operator" data-operator="÷" aria-label="Divide">÷</button>

            <!-- Row 2 -->
            <button type="button" class="key" data-digit="7">7</button>
            <button type="button" class="key" data-digit="8">8</button>
            <button type="button" class="key" data-digit="9">9</button>
            <button type="button" class="key operator" data-operator="×" aria-label="Multiply">×</button>

            <!-- Row 3 -->
            <button type="button" class="key" data-digit="4">4</button>
            <button type="button" class="key" data-digit="5">5</button>
            <button type="button" class="key" data-digit="6">6</button>
            <button type="button" class="key operator" data-operator="−" aria-label="Subtract">−</button>

            <!-- Row 4 -->
            <button type="button" class="key" data-digit="1">1</button>
            <button type="button" class="key" data-digit="2">2</button>
            <button type="button" class="key" data-digit="3">3</button>
            <button type="button" class="key operator" data-operator="+" aria-label="Add">+</button>

            <!-- Row 5 -->
            <button type="button" class="key" data-digit="0">0</button>
            <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
            <button type="button" class="key function" data-action="backspace" aria-label="Backspace">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
                    <path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
                    <path d="M17 9l-6 6M11 9l6 6" />
                </svg>
            </button>
            <button type="button" class="key equals" data-action="equals" aria-label="Equals">=</button>
        </div>
    </main>

    <script src="calculator.js?v=3"></script>
</body>
</html>
