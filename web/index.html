<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15803D" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="calculator">
        <!-- Display -->
        <div class="display" aria-live="polite">
            <div id="expression" class="expression"></div>
            <div id="result" class="result">0</div>
        </div>

        <div class="keys">
            <!-- Row 1 -->
            <button class="function" data-action="clear" aria-label="Clear">C</button>
            <button class="function" data-action="negate" aria-label="Change sign">±</button>
            <button class="function" data-action="percent" aria-label="Percent">%</button>
            <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

            <!-- Row 2 -->
            <button data-digit="7">7</button>
            <button data-digit="8">8</button>
            <button data-digit="9">9</button>
            <button class="operator" data-operator="×" aria-label="Multiply">×</button>

            <!-- Row 3 -->
            <button data-digit="4">4</button>
            <button data-digit="5">5</button>
            <button data-digit="6">6</button>
            <button class="operator" data-operator="−" aria-label="Subtract">−</button>

            <!-- Row 4 -->
            <button data-digit="1">1</button>
            <button data-digit="2">2</button>
            <button data-digit="3">3</button>
            <button class="operator" data-operator="+" aria-label="Add">+</button>

            <!-- Row 5 -->
            <button data-digit="0">0</button>
            <button data-action="decimal" aria-label="Decimal point">.</button>
            <button class="function" data-action="backspace" aria-label="Backspace">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
                    <path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
                    <path d="M17 9l-6 6M11 9l6 6" />
                </svg>
            </button>
            <button class="operator" data-action="equals" aria-label="Equals">=</button>
        </div>
    </main>

    <script src="calculator.js"></script>
</body>
</html>
